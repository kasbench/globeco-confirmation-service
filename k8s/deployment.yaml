apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-confirmation-service
  namespace: globeco
  labels:
    app: globeco-confirmation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globeco-confirmation-service
  template:
    metadata:
      labels:
        app: globeco-confirmation-service
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: globeco-confirmation-service
          image: kasbench/globeco-confirmation-service:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            # Inject pod/node metadata from the Downward API
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: OTEL_SERVICE_NAME
              value: "globeco-confirmation-service"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "$(NODE_IP):4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                service.name=globeco-confirmation-service,
                service.version=1.0.0,
                service.namespace=globeco,
                k8s.pod.ip=$(MY_POD_IP),
                k8s.pod.name=$(MY_POD_NAME),
                k8s.node.name=$(MY_NODE_NAME),
                k8s.namespace.name=$(MY_NAMESPACE)
            - name: TRACING_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 1000Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
