apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-allocation-service
  namespace: globeco
  labels:
    app: globeco-allocation-service
    environment: aws

spec:
  {{- if eq .Values.autoscaler "vpa" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-allocation-service

  template:
    metadata:
      labels:
        app: globeco-allocation-service

    spec:
      serviceAccountName: globeco-allocation-service

      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to become available..."
              until pg_isready -h globeco-allocation-service-postgresql -p 5432; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              echo "PostgreSQL is up - continuing"

      containers:
        - name: globeco-allocation-service
          image: kasbench/globeco-allocation-service-server:1.0.3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8089
              name: http

          envFrom:
            - configMapRef:
                name: allocation-service-config-aws

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: OBSERVABILITY_OTEL_ENDPOINT
              value: "$(NODE_IP):4317"

            - name: OTEL_SERVICE_NAME
              value: "globeco-allocation-service"

            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                k8s.pod.ip=$(MY_POD_IP),
                k8s.pod.name=$(MY_POD_NAME),
                k8s.node.name=$(MY_NODE_NAME),
                k8s.namespace.name=$(MY_NAMESPACE)

          volumeMounts:
            - name: data
              mountPath: /data

            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired

            - resourceName: memory
              restartPolicy: RestartContainer

          resources:
            requests:
              memory: "100Mi"
              cpu: "200m"
            limits:
              memory: "100Mi"
              cpu: "200m"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-efs-pvc

        - name: tmp
          emptyDir:
            sizeLimit: 1Gi


{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-allocation-service-pdb
  namespace: globeco

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: globeco-allocation-service
{{- end }}