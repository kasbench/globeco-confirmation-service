apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-confirmation-service
  namespace: globeco
  labels:
    app: globeco-confirmation-service
spec:
  {{- include "globeco.replicas" . | nindent 2 }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: globeco-confirmation-service
  template:
    metadata:
      labels:
        app: globeco-confirmation-service
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z globeco-execution-service-kafka 9092; do echo "Waiting for Kafka..."; sleep 2; done']
      containers:
        - name: globeco-confirmation-service
          image: kasbench/globeco-confirmation-service:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          # NOTE: No exec-based preStop hook here. The image is distroless
          # (gcr.io/distroless/static-debian12), which has no shell, so an
          # `sh -c` preStop command fails and produces FailedPreStopHook events.
          # Graceful shutdown is already handled by the service itself: it traps
          # SIGTERM, cancels its context, drains the Kafka consumer in order, and
          # shuts down the HTTP server within terminationGracePeriodSeconds.
          # If a pre-stop delay is ever needed, use the shell-free native sleep
          # action (Kubernetes >= 1.29):
          #   lifecycle:
          #     preStop:
          #       sleep:
          #         seconds: 5
          env:
            - name: OTEL_SERVICE_NAME
              value: "globeco-confirmation-service"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector-daemonset-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=globeco-confirmation-service,service.version=1.0.0,service.namespace=globeco"
            - name: TRACING_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "true"
            # Artificial per-message processing delay to slow the processing loop
            # for autoscaling testing. Go duration string (e.g. "50ms", "1s").
            - name: PROCESSING_SLEEP
              value: "50ms"
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          {{- include "globeco.globecoConfirmationServiceResources" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
---
{{- if eq .Values.autoscaler "vpa" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-confirmation-service-pdb
  namespace: globeco
  labels:
    app: globeco-confirmation-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: globeco-confirmation-service
{{- end }}
