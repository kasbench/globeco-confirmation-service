apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-confirmation-service
  namespace: globeco
  labels:
    app: globeco-confirmation-service
spec:
  {{- if eq .Values.autoscaler "vpa" }}
  replicas: 2
  {{- else if eq .Values.autoscaler "horizontal-2" }}
  replicas: 2
  {{- else if eq .Values.autoscaler "horizontal-3" }}
  replicas: 3
  {{- else if eq .Values.autoscaler "horizontal-4" }}
  replicas: 4
  {{- else if eq .Values.autoscaler "horizontal-5" }}
  replicas: 5
  {{- else if eq .Values.autoscaler "horizontal-6" }}
  replicas: 6
  {{- else }}
  replicas: 1
  {{- end }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: globeco-confirmation-service
  template:
    metadata:
      labels:
        app: globeco-confirmation-service
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z globeco-execution-service-kafka 9092; do echo "Waiting for Kafka..."; sleep 2; done']
      containers:
        - name: globeco-confirmation-service
          image: kasbench/globeco-confirmation-service:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "globeco-confirmation-service"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector-daemonset-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=globeco-confirmation-service,service.version=1.0.0,service.namespace=globeco"
            - name: TRACING_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "true"
            # Artificial per-message processing delay to slow the processing loop
            # for autoscaling testing. Go duration string (e.g. "50ms", "1s").
            - name: PROCESSING_SLEEP
              value: "50ms"
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              memory: "100Mi"
              {{- if eq .Values.autoscaler "vertical-2" }}
              cpu: "75.0m"
              {{- else if eq .Values.autoscaler "vertical-3" }}
              cpu: "100.0m"
              {{- else if eq .Values.autoscaler "vertical-4" }}
              cpu: "125.0m"
              {{- else if eq .Values.autoscaler "vertical-5" }}
              cpu: "150.0m"
              {{- else if eq .Values.autoscaler "vertical-6" }}
              cpu: "175.0m"
              {{- else }}
              cpu: "50m"
              {{- end }}
            limits:
              memory: "6000Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8086
            # initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
---
{{- if eq .Values.autoscaler "vpa" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-confirmation-service-pdb
  namespace: globeco
  labels:
    app: globeco-confirmation-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: globeco-confirmation-service
{{- end }}
